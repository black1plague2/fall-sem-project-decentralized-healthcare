<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — Cardano Healthcare Vault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23141210' d='M50 6c25 0 44 20 44 45S75 96 50 96 6 75 6 51 25 6 50 6Z'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/base.css" />
<link rel="stylesheet" href="/dashboard.css" />
</head>
<body>

<div class="blobfield" aria-hidden="true"></div>

<div class="dash">
  <aside class="dash-sidebar">
    <a class="dash-brand" href="/">
      <span class="icon-badge icon-badge--outline icon-badge--sm" data-icon="shieldCheck"></span>
      <span class="dash-brand__name">Cardano<br/>Healthcare Vault</span>
    </a>

    <nav class="dash-nav" id="dashNav">
      <button class="dash-nav__item" data-section="overview">
        <span class="dash-nav__icon" data-icon="home"></span> Overview
      </button>
      <button class="dash-nav__item" data-section="upload">
        <span class="dash-nav__icon" data-icon="cloudUpload"></span> Upload &amp; Encrypt
      </button>
      <button class="dash-nav__item" data-section="records">
        <span class="dash-nav__icon" data-icon="files"></span> Records
      </button>
      <button class="dash-nav__item" data-section="access">
        <span class="dash-nav__icon" data-icon="shieldCheck"></span> Access &amp; Permissions
      </button>
      <button class="dash-nav__item" data-section="audit">
        <span class="dash-nav__icon" data-icon="clipboardList"></span> Audit Log
      </button>
      <button class="dash-nav__item" data-section="actors">
        <span class="dash-nav__icon" data-icon="users"></span> Actors
      </button>
    </nav>

    <div class="dash-sidebar__spacer"></div>

    <div class="dash-actor-block">
      <div class="dash-actor-block__label">Acting as</div>
      <div class="dash-actor-list" id="actorList">
        <div class="actor-row" data-actor="01"><span class="actor-row__glyph icon-badge--patient" data-icon="user"></span><span class="actor-row__name">Patient</span></div>
        <div class="actor-row" data-actor="02"><span class="actor-row__glyph icon-badge--doctor" data-icon="stethoscope"></span><span class="actor-row__name">Doctor</span></div>
        <div class="actor-row" data-actor="03"><span class="actor-row__glyph icon-badge--hospital" data-icon="building2"></span><span class="actor-row__name">Hospital</span></div>
        <div class="actor-row" data-actor="04"><span class="actor-row__glyph icon-badge--insurance" data-icon="umbrella"></span><span class="actor-row__name">Insurance</span></div>
      </div>
    </div>

    <a class="dash-home-link" href="/">&larr; Back to home</a>
  </aside>

  <div class="dash-main">
    <header class="dash-topbar">
      <div>
        <h1 class="dash-topbar__title" id="topbarTitle">Overview</h1>
      </div>
    </header>

    <main class="dash-content" id="dashContent"></main>
  </div>
</div>

<script src="/icons.js" defer></script>
<script src="/dashboard.js" defer></script>
</body>
</html>
